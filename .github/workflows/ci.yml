name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Lint & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Unit & Smoke Tests
        run: npm test

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-key-for-build-check

      - name: Production Server Route Smoke Test
        run: |
          npm start &
          PID=$!
          echo "Waiting for Next.js production server to start on port 3000..."
          for i in $(seq 1 30); do
            if curl -sI http://localhost:3000 > /dev/null; then
              echo "Server ready!"
              break
            fi
            sleep 1
          done

          # Check headers
          curl -sI http://localhost:3000 | grep -i "content-security-policy"
          curl -sI http://localhost:3000 | grep -i "x-content-type-options: nosniff"

          # Check homepage and tools
          ROUTES=(
            "/"
            "/privacy"
            "/terms"
            "/tools/compress"
            "/tools/convert"
            "/tools/merge"
            "/tools/pdf-maker"
            "/tools/pdf-extractor"
            "/tools/pdf-summarizer"
            "/tools/image-compressor"
            "/tools/image-converter"
            "/tools/passport-photo"
            "/tools/cropper"
            "/tools/analysis"
            "/tools/vault"
          )

          for route in "${ROUTES[@]}"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000${route}")
            if [ "$STATUS" -ne 200 ]; then
              echo "Route ${route} failed with status ${STATUS}"
              kill $PID
              exit 1
            fi
            echo "✓ ${route} -> ${STATUS}"
          done

          kill $PID
